                    <div class="page-content">

                         <div class="col-xl-6 col-lg-8 col-md-10">

                              <div class="card">
                              <div class="card-header">
                                   <h4 class="card-title mb-0">Add Menu Item</h4>
                              </div>

                              <div class="card-body">
                                   <form>

                                   <!-- Product Name -->
                                   <div class="mb-3 position-relative">
                                        <label class="form-label">Product Name</label>

                                        <input
                                        type="text"
                                        id="productSearch"
                                        class="form-control"
                                        placeholder="Type product name..."
                                        autocomplete="off"
                                        >

                                        <!-- Dropdown -->
                                        <div
                                        id="productDropdown"
                                        class="list-group position-absolute w-100 shadow-sm"
                                        style="z-index: 1000; display: none;"
                                        ></div>
                                   </div>

                                   <!-- Image Preview -->
                                   <div class="mb-3">
                                        <img
                                        id="productPreview"
                                        src="assets/images/placeholder.png"
                                        class="rounded border"
                                        style="width:120px; height:120px; object-fit:cover;"
                                        >
                                   </div>

                                   <!-- Category -->
                                   <div class="mb-3">
                                        <label class="form-label">Category</label>
                                             <select class="form-control" id="menuCategory">
                                             <option value="">Select Category</option>
                                        </select>
                                   </div>

                                   <!-- Price -->
                                   <div class="mb-3">
                                   <label class="form-label">Price (₦)</label>
                                   <input type="number" class="form-control" placeholder="5500">
                                   </div>

                                   <!-- Unit Type -->
                                   <div class="mb-3">
                                   <label class="form-label">Selling Unit</label>
                                   <select class="form-control">
                                        <option value="">Select Unit</option>
                                        <option value="plate">Plate</option>
                                        <option value="bottle">Bottle</option>
                                        <option value="cup">Cup</option>
                                        <option value="portion">Portion</option>
                                        <option value="dozen">Dozen</option>
                                        <option value="kg">Kilogram (kg)</option>
                                   </select>
                                   </div>

                                   <!-- Stock Quantity -->
                                   <div class="mb-3">
                                   <label class="form-label">Available Quantity</label>
                                   <input type="number" class="form-control" placeholder="e.g. 25">
                                   </div>

                                   <!-- Minimum Stock Alert -->
                                   <div class="mb-3">
                                   <label class="form-label">Low Stock Alert</label>
                                   <input type="number" class="form-control" placeholder="e.g. 5">
                                   <small class="text-muted">Alert when stock goes below this number</small>
                                   </div>

                                   <!-- Availability -->
                                   <div class="form-check mb-3">
                                   <input class="form-check-input" type="checkbox" checked>
                                   <label class="form-check-label">
                                        Available for Sale
                                   </label>
                                   </div>

                                   <!-- Description -->
                                   <div class="mb-3">
                                   <label class="form-label">Description</label>
                                   <textarea class="form-control" rows="3" placeholder="Optional description"></textarea>
                                   </div>

                                   <!-- Image -->
                                   <!-- <div class="mb-3">
                                   <label class="form-label">Product Image</label>
                                   <input type="file" class="form-control">
                                   </div> -->

                                   </form>
                              </div>
                              </div>
